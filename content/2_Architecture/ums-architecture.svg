<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Helvetica, Arial, sans-serif">
  <title>FortiGate UMS on AWS: architecture</title>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8540"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#da291c"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="540" y="18" width="200" height="44" rx="22" fill="#eef2f6" stroke="#8a99a8"/>
  <text x="640" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Internet</text>

  <!-- Inspection VPC -->
  <rect x="380" y="100" width="520" height="470" rx="8" fill="#fff8f0" stroke="#e08a2c" stroke-width="2"/>
  <text x="396" y="124" font-size="15" font-weight="bold" fill="#b5651d">Inspection VPC</text>
  <text x="396" y="142" font-size="12" fill="#666">vpc_cidr_inspection</text>

  <rect x="520" y="132" width="240" height="44" rx="5" fill="#ffffff" stroke="#e08a2c"/>
  <text x="640" y="151" text-anchor="middle" font-size="13" fill="#333">Internet Gateway + NAT Gateways</text>
  <text x="640" y="168" text-anchor="middle" font-size="11" fill="#666">access_internet_mode = "nat_gw" or "eip"</text>

  <!-- ASG -->
  <rect x="410" y="206" width="460" height="132" rx="6" fill="#fdecea" stroke="#da291c" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="424" y="226" font-size="13" font-weight="bold" fill="#a51d12">FortiGate UMS group</text>
  <text x="856" y="226" text-anchor="end" font-size="11" fill="#a51d12">Auto Scaling group asg-fgt_ums_asg</text>
  <g font-size="13" text-anchor="middle">
    <rect x="430" y="240" width="130" height="80" rx="5" fill="#da291c"/>
    <text x="495" y="272" fill="#fff" font-weight="bold">FortiGate</text>
    <text x="495" y="292" fill="#fff" font-size="12">AZ1</text>
    <rect x="575" y="240" width="130" height="80" rx="5" fill="#da291c"/>
    <text x="640" y="272" fill="#fff" font-weight="bold">FortiGate</text>
    <text x="640" y="292" fill="#fff" font-size="12">AZ2</text>
    <rect x="720" y="240" width="130" height="80" rx="5" fill="#ffffff" stroke="#da291c" stroke-dasharray="5 3"/>
    <text x="785" y="272" fill="#da291c" font-weight="bold">FortiGate</text>
    <text x="785" y="292" fill="#da291c" font-size="12">added by scale-out</text>
  </g>

  <!-- GWLB -->
  <rect x="500" y="378" width="280" height="48" rx="5" fill="#ffffff" stroke="#e08a2c" stroke-width="1.5"/>
  <text x="640" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Gateway Load Balancer</text>
  <text x="640" y="415" text-anchor="middle" font-size="11" fill="#666">target group: GENEVE, UDP 6081, health check 8008</text>

  <!-- GWLBe -->
  <rect x="430" y="456" width="150" height="40" rx="5" fill="#ffffff" stroke="#e08a2c"/>
  <text x="505" y="481" text-anchor="middle" font-size="13" fill="#333">GWLB endpoint AZ1</text>
  <rect x="700" y="456" width="150" height="40" rx="5" fill="#ffffff" stroke="#e08a2c"/>
  <text x="775" y="481" text-anchor="middle" font-size="13" fill="#333">GWLB endpoint AZ2</text>

  <rect x="500" y="520" width="280" height="36" rx="5" fill="#ffffff" stroke="#e08a2c"/>
  <text x="640" y="543" text-anchor="middle" font-size="13" fill="#333">Transit Gateway attachment subnets</text>

  <!-- Spokes and TGW -->
  <rect x="40" y="140" width="210" height="80" rx="8" fill="#f2f7fc" stroke="#1f6fb2" stroke-width="1.5"/>
  <text x="56" y="164" font-size="14" font-weight="bold" fill="#1f6fb2">East spoke VPC</text>
  <text x="56" y="184" font-size="12" fill="#555">vpc_cidr_east</text>
  <text x="56" y="204" font-size="12" fill="#555">0.0.0.0/0 → Transit Gateway</text>
  <rect x="40" y="250" width="210" height="80" rx="8" fill="#f2f7fc" stroke="#1f6fb2" stroke-width="1.5"/>
  <text x="56" y="274" font-size="14" font-weight="bold" fill="#1f6fb2">West spoke VPC</text>
  <text x="56" y="294" font-size="12" fill="#555">vpc_cidr_west</text>
  <text x="56" y="314" font-size="12" fill="#555">0.0.0.0/0 → Transit Gateway</text>

  <rect x="60" y="440" width="170" height="70" rx="35" fill="#1f6fb2"/>
  <text x="145" y="471" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Transit Gateway</text>
  <text x="145" y="490" text-anchor="middle" font-size="11" fill="#dbe9f6">appliance mode</text>

  <line x1="145" y1="220" x2="145" y2="250" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="145" y1="330" x2="145" y2="436" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#aBlue)" marker-start="url(#aBlue)"/>
  <path d="M232,490 C330,500 420,540 496,538" fill="none" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#aBlue)" marker-start="url(#aBlue)"/>
  <line x1="560" y1="520" x2="530" y2="500" stroke="#1f6fb2" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="720" y1="520" x2="750" y2="500" stroke="#1f6fb2" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="145" y="532" font-size="12" fill="#1f6fb2" text-anchor="middle">centralized egress</text>
  <text x="145" y="548" font-size="12" fill="#1f6fb2" text-anchor="middle">and east-west</text>

  <!-- GWLBe to GWLB, GWLB to FortiGates (GENEVE) -->
  <line x1="530" y1="456" x2="575" y2="430" stroke="#555" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="750" y1="456" x2="705" y2="430" stroke="#555" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="560" y1="378" x2="505" y2="324" stroke="#da291c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aRed)" marker-start="url(#aRed)"/>
  <line x1="640" y1="378" x2="640" y2="324" stroke="#da291c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aRed)" marker-start="url(#aRed)"/>
  <line x1="720" y1="378" x2="775" y2="324" stroke="#da291c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aRed)" marker-start="url(#aRed)"/>
  <text x="396" y="356" font-size="12" fill="#da291c">GENEVE</text>
  <text x="396" y="371" font-size="11" fill="#da291c">geneve-az1, -az2</text>

  <!-- FortiGate egress to internet -->
  <line x1="640" y1="240" x2="640" y2="180" stroke="#555" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="640" y1="132" x2="640" y2="66" stroke="#555" stroke-width="2.5" marker-end="url(#aGray)"/>

  <!-- Distributed egress VPCs -->
  <g>
    <rect x="960" y="100" width="280" height="200" rx="8" fill="#f1f8f2" stroke="#2e8540" stroke-width="1.5"/>
    <text x="976" y="124" font-size="14" font-weight="bold" fill="#2e8540">Distributed egress VPC 1</text>
    <text x="976" y="142" font-size="12" fill="#555">vpc_cidr_distributed_1</text>
    <rect x="990" y="154" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="176" text-anchor="middle" font-size="13" fill="#333">Internet Gateway</text>
    <rect x="990" y="200" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="222" text-anchor="middle" font-size="13" fill="#333">GWLB endpoint</text>
    <rect x="990" y="246" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="268" text-anchor="middle" font-size="13" fill="#333">Workload subnet</text>
    <line x1="1100" y1="246" x2="1100" y2="238" stroke="#2e8540" stroke-width="2" marker-end="url(#aGreen)"/>
    <line x1="1100" y1="200" x2="1100" y2="192" stroke="#2e8540" stroke-width="2" marker-end="url(#aGreen)"/>
  </g>
  <g>
    <rect x="960" y="320" width="280" height="200" rx="8" fill="#f1f8f2" stroke="#2e8540" stroke-width="1.5"/>
    <text x="976" y="344" font-size="14" font-weight="bold" fill="#2e8540">Distributed egress VPC 2</text>
    <text x="976" y="362" font-size="12" fill="#555">vpc_cidr_distributed_2</text>
    <rect x="990" y="374" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="396" text-anchor="middle" font-size="13" fill="#333">Internet Gateway</text>
    <rect x="990" y="420" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="442" text-anchor="middle" font-size="13" fill="#333">GWLB endpoint</text>
    <rect x="990" y="466" width="220" height="34" rx="5" fill="#fff" stroke="#2e8540"/>
    <text x="1100" y="488" text-anchor="middle" font-size="13" fill="#333">Workload subnet</text>
    <line x1="1100" y1="466" x2="1100" y2="458" stroke="#2e8540" stroke-width="2" marker-end="url(#aGreen)"/>
    <line x1="1100" y1="420" x2="1100" y2="412" stroke="#2e8540" stroke-width="2" marker-end="url(#aGreen)"/>
  </g>
  <path d="M990,217 C920,217 860,300 784,392" fill="none" stroke="#2e8540" stroke-width="2.5" marker-end="url(#aGreen)" marker-start="url(#aGreen)"/>
  <path d="M990,437 C920,437 860,420 784,410" fill="none" stroke="#2e8540" stroke-width="2.5" marker-end="url(#aGreen)" marker-start="url(#aGreen)"/>
  <text x="912" y="560" font-size="12" fill="#2e8540" text-anchor="middle">distributed egress (no Transit Gateway)</text>
  <path d="M1210,171 C1250,90 900,40 744,40" fill="none" stroke="#2e8540" stroke-width="2" stroke-dasharray="2 0" marker-end="url(#aGreen)"/>

  <!-- Management VPC -->
  <rect x="380" y="600" width="520" height="180" rx="8" fill="#f6f2fb" stroke="#6b3fa0" stroke-width="2"/>
  <text x="396" y="624" font-size="15" font-weight="bold" fill="#6b3fa0">Management VPC</text>
  <text x="396" y="642" font-size="12" fill="#666">vpc_cidr_management</text>
  <rect x="410" y="656" width="200" height="100" rx="6" fill="#6b3fa0"/>
  <text x="510" y="690" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">FortiManager</text>
  <text x="510" y="710" text-anchor="middle" font-size="12" fill="#efe6fa">7.6.4 or later</text>
  <text x="510" y="728" text-anchor="middle" font-size="12" fill="#efe6fa">fixed address (Elastic IP)</text>
  <text x="510" y="746" text-anchor="middle" font-size="12" fill="#efe6fa">fgfm-allow-vm enable</text>
  <rect x="640" y="672" width="110" height="60" rx="5" fill="#fff" stroke="#6b3fa0"/>
  <text x="695" y="700" text-anchor="middle" font-size="13" fill="#333">Jump box</text>
  <text x="695" y="718" text-anchor="middle" font-size="11" fill="#666">optional</text>
  <rect x="770" y="672" width="110" height="60" rx="5" fill="#fff" stroke="#6b3fa0"/>
  <text x="825" y="700" text-anchor="middle" font-size="13" fill="#333">FortiAnalyzer</text>
  <text x="825" y="718" text-anchor="middle" font-size="11" fill="#666">optional</text>

  <!-- Control plane -->
  <path d="M410,690 L340,690 L340,280 L406,280" fill="none" stroke="#6b3fa0" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aPurple)" marker-start="url(#aPurple)"/>
  <text x="326" y="400" font-size="12" font-weight="bold" fill="#6b3fa0" text-anchor="middle" transform="rotate(-90 326 400)">FGFM TCP 541</text>

  <rect x="960" y="604" width="280" height="62" rx="6" fill="#fff" stroke="#6b3fa0"/>
  <text x="1100" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">AWS Auto Scaling API</text>
  <text x="1100" y="650" text-anchor="middle" font-size="11" fill="#666">min / max / desired of asg-fgt_ums_asg</text>
  <rect x="960" y="700" width="280" height="62" rx="6" fill="#fff" stroke="#6b3fa0"/>
  <text x="1100" y="726" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">FortiFlex (FortiCloud)</text>
  <text x="1100" y="746" text-anchor="middle" font-size="11" fill="#666">VM entitlements and tokens</text>
  <path d="M610,676 C760,640 860,635 956,635" fill="none" stroke="#6b3fa0" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aPurple)"/>
  <text x="930" y="594" font-size="12" fill="#6b3fa0" text-anchor="middle">SDN connector</text>
  <path d="M610,740 C760,760 860,731 956,731" fill="none" stroke="#6b3fa0" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aPurple)"/>
  <text x="1100" y="790" font-size="12" fill="#6b3fa0" text-anchor="middle">FortiFlex connector</text>

  <!-- Legend -->
  <rect x="40" y="600" width="210" height="180" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="624" font-size="13" font-weight="bold" fill="#333">Legend</text>
  <line x1="56" y1="648" x2="100" y2="648" stroke="#1f6fb2" stroke-width="2.5"/>
  <text x="110" y="652" font-size="12" fill="#333">centralized traffic</text>
  <line x1="56" y1="676" x2="100" y2="676" stroke="#2e8540" stroke-width="2.5"/>
  <text x="110" y="680" font-size="12" fill="#333">distributed egress</text>
  <line x1="56" y1="704" x2="100" y2="704" stroke="#da291c" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="110" y="708" font-size="12" fill="#333">GENEVE tunnels</text>
  <line x1="56" y1="732" x2="100" y2="732" stroke="#6b3fa0" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="110" y="736" font-size="12" fill="#333">FortiManager control</text>
  <line x1="56" y1="760" x2="100" y2="760" stroke="#555" stroke-width="2.5"/>
  <text x="110" y="764" font-size="12" fill="#333">to / from internet</text>
</svg>
